<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nectar.css - A classless CSS framework</title>
    <style>
        :root {
            --bg: #fff;
            --text: #222;
            --text-light: #666;
            --heading: #111;
            --button-bg: #e87840;
            --button-hover: #d86830;
            --bg-alt: #f0f0f0;
            --font-main: system-ui, -apple-system, sans-serif;
            --transition: 0.2s ease-out;
        }

        .dark-theme {
            --bg: #111;
            --text: #f1f1f1;
            --text-light: #c9c9c9;
            --heading: #fff;
            --bg-alt: #2a2a2a;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: var(--font-main);
            font-size: 16px;
            line-height: 1.5;
            color: var(--text);
            background: var(--bg);
            
            /* Центрування */
            min-height: 100dvh; 
            display: flex;
            flex-direction: column;
            justify-content: center; /* Центрує по вертикалі */
            align-items: center;     /* Центрує по горизонталі */
            position: relative;      /* Важливо для абсолютних елементів всередині */
            overflow-x: hidden;      /* Запобігає горизонтальній прокрутці */
        }

        /* === Кнопки управління (Верхній правий кут) === */
        .controls {
            position: absolute;
            top: 20px;
            right: 20px;
            display: flex;
            gap: 10px;
            z-index: 100;
        }

        .icon-toggle {
            width: 44px;
            height: 44px;
            background: #000;
            color: #fff;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .icon-toggle img {
            width: 20px;
            height: 20px;
            filter: invert(1);
        }

        .icon-toggle:hover { transform: scale(1.05); }
        .icon-toggle:active { transform: scale(0.95); }

        /* === Основний контент === */
        main {
            max-width: 800px;
            width: 100%;
            text-align: center;
            padding: 20px;
            /* Важливо: flex працює краще, коли margin не заважають */
        }

        h1 {
            color: var(--heading);
            font-weight: 800;
            font-size: 3.5rem;
            line-height: 1.1;
            margin-bottom: 0.5rem;
            letter-spacing: -1px;
        }

        .subtitle {
            font-size: 1.25rem;
            color: var(--text-light);
            margin-bottom: 2rem;
            font-weight: 300;
            min-height: 1.5em;
        }

        .cta {
            display: flex;
            gap: 1rem;
            justify-content: center;
            margin-bottom: 1.5rem;
            flex-wrap: wrap;
        }

        button.primary, button.secondary {
            padding: 0.8rem 0;
            width: 150px;
            font-family: inherit;
            font-size: 1rem;
            font-weight: 600;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: all var(--transition);
            text-align: center;
        }

        button.primary { background: var(--button-bg); color: #fff; }
        button.primary:hover { background: var(--button-hover); transform: translateY(-2px); box-shadow: 0 4px 12px rgba(232, 120, 64, 0.3); }

        button.secondary { background: var(--bg-alt); color: var(--text); }
        button.secondary:hover { background: #e0e0e0; transform: translateY(-2px); }

        .meta { font-size: 0.85rem; color: var(--text-light); margin-bottom: 2.5rem; opacity: 0.8; }

        .features {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1.5rem;
            margin-bottom: 1rem;
        }
        .feature { color: var(--text); font-weight: 500; font-size: 0.95rem; }

        /* === Футер (Нижній центр) === */
        footer {
            position: absolute; /* Вирвали з потоку */
            bottom: 20px;       /* Прибили до низу */
            left: 0;
            right: 0;
            font-size: 0.85rem;
            color: var(--text-light);
            text-align: center;
            width: 100%;
            pointer-events: none; /* Щоб не перекривав кліки, якщо прозорий */
        }
        
        footer p { pointer-events: auto; } /* Повертаємо кліки для тексту */

        footer a { color: var(--text); text-decoration: none; font-weight: 600; border-bottom: 1px dotted var(--text-light); }
        footer a:hover { color: var(--button-bg); border-bottom-style: solid; }

        /* Адаптив */
        @media (max-width: 600px) {
            h1 { font-size: 2.5rem; }
            .features { grid-template-columns: 1fr; gap: 0.5rem; }
            .cta { flex-direction: column; align-items: center; }
            button.primary, button.secondary { width: 100%; max-width: 280px; }
            
            /* На мобільних, якщо екран малий, футер може налізти на контент. 
               Робимо його не фіксованим, якщо висота мала */
            @media (max-height: 700px) {
                body {
                    justify-content: flex-start; /* Не центруємо, а пускаємо зверху */
                    padding-top: 80px; /* Місце під кнопку мови */
                    padding-bottom: 60px; /* Місце під футер */
                }
                /* main залишається як є */
            }
        }
    </style>
</head>
<body>
    <div class="controls">
        <button id="themeToggle" class="icon-toggle" title="Toggle theme" aria-label="Toggle theme">
            <img id="themeIcon" src="icons/night.svg" alt="Theme toggle icon">
        </button>
        <button id="langToggle" class="icon-toggle" title="Switch language" aria-label="Switch language">
            <img src="icons/language.svg" alt="Language toggle icon">
        </button>
    </div>

    <main>
        <h1>🍑 Nectar.css</h1>
        <p class="subtitle" id="subtitle">A classless CSS framework for semantic HTML</p>

        <div class="cta">
            <button class="primary" onclick="window.location.href='demo.html'" id="demoBtn">View Demo</button>
            <button class="secondary" onclick="window.location.href='nectar.css'" download id="downloadBtn">Download</button>
        </div>

        <p class="meta">~8KB • MIT License • No Dependencies</p>

        <div class="features">
            <div class="feature" id="feature1">No classes needed</div>
            <div class="feature" id="feature2">Lightweight</div>
            <div class="feature" id="feature3">Fully responsive</div>
            <div class="feature" id="feature4">CSS variables</div>
            <div class="feature" id="feature5">Modern browsers</div>
            <div class="feature" id="feature6">Accessible</div>
        </div>
    </main>

    <footer>
        <p id="footer">Created by <a href="https://github.com/Shkrabaliuk">Shkrabaliuk</a> with ❤️ to Ukraine</p>
    </footer>

    <script>
        const langToggle = document.getElementById('langToggle');
        const themeToggle = document.getElementById('themeToggle');
        const themeIcon = document.getElementById('themeIcon');
        const root = document.documentElement;
        const footerHTML = 'Created by <a href="https://github.com/Shkrabaliuk">Shkrabaliuk</a> with ❤️ to Ukraine';

        function updateThemeIcon() {
            const isDark = root.classList.contains('dark-theme');
            themeIcon.src = isDark ? 'icons/sun.svg' : 'icons/night.svg';
            themeToggle.title = isDark ? 'Switch to light theme' : 'Switch to dark theme';
            themeToggle.setAttribute('aria-label', themeToggle.title);
        }

        if (localStorage.getItem('theme') === 'dark') {
            root.classList.add('dark-theme');
        }
        updateThemeIcon();

        themeToggle.addEventListener('click', () => {
            root.classList.toggle('dark-theme');
            localStorage.setItem('theme', root.classList.contains('dark-theme') ? 'dark' : 'light');
            updateThemeIcon();
        });

        const translations = {
            en: {
                subtitle: 'A classless CSS framework for semantic HTML',
                demoBtn: 'View Demo',
                downloadBtn: 'Download',
                feature1: 'No classes needed',
                feature2: 'Lightweight',
                feature3: 'Fully responsive',
                feature4: 'CSS variables',
                feature5: 'Modern browsers',
                feature6: 'Accessible'
            },
            ua: {
                subtitle: 'CSS фреймворк без класів для семантичного HTML',
                demoBtn: 'Демо',
                downloadBtn: 'Завантажити',
                feature1: 'Без класів',
                feature2: 'Легкий (~8KB)',
                feature3: 'Повністю адаптивний',
                feature4: 'CSS змінні',
                feature5: 'Сучасні браузери',
                feature6: 'Доступність (a11y)'
            }
        };

        const savedLang = localStorage.getItem('lang') || 'en';
        document.documentElement.lang = savedLang;
        langToggle.title = savedLang === 'en' ? 'Перемкнути на українську' : 'Switch to English';
        langToggle.setAttribute('aria-label', langToggle.title);
        document.getElementById('footer').innerHTML = footerHTML;

        if (savedLang === 'ua') updateContent('ua');

        langToggle.addEventListener('click', () => {
            const currentLang = document.documentElement.lang;
            const newLang = currentLang === 'en' ? 'ua' : 'en';
            document.documentElement.lang = newLang;
            langToggle.title = newLang === 'en' ? 'Перемкнути на українську' : 'Switch to English';
            langToggle.setAttribute('aria-label', langToggle.title);
            localStorage.setItem('lang', newLang);
            updateContent(newLang);
        });

        function updateContent(lang) {
            const t = translations[lang];
            document.getElementById('subtitle').textContent = t.subtitle;
            document.getElementById('demoBtn').textContent = t.demoBtn;
            document.getElementById('downloadBtn').textContent = t.downloadBtn;
            document.getElementById('feature1').textContent = t.feature1;
            document.getElementById('feature2').textContent = t.feature2;
            document.getElementById('feature3').textContent = t.feature3;
            document.getElementById('feature4').textContent = t.feature4;
            document.getElementById('feature5').textContent = t.feature5;
            document.getElementById('feature6').textContent = t.feature6;
        }
    </script>
</body>
</html>
